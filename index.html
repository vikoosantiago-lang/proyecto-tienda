<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mi Tienda Online</title>

    <!-- Conexión con CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Encabezado -->
    <header>
        <h1>Mi Tienda Online</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="#productos">Productos</a>
            <a href="#contacto">Contacto</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main>

        <!-- Bienvenida -->
        <section class="bienvenida">
            <h2>Bienvenido a nuestra tienda</h2>
            <p>Encuentra los mejores productos.</p>
        </section>

        <!-- Productos -->
        <section id="productos">
            <h2>Nuestros productos</h2>

            <div class="contenedor-productos">

                <article class="producto">
                    <h3>Audífonos</h3>
                    <p>Precio: $350</p>
                    <button type="button">
                        Comprar
                    </button>
                </article>

                <article class="producto">
                    <h3>Teclado</h3>
                    <p>Precio: $500</p>
                    <button type="button">
                        Comprar
                    </button>
                </article>

                <article class="producto">
                    <h3>Mouse</h3>
                    <p>Precio: $250</p>
                    <button type="button">
                        Comprar
                    </button>
                </article>

            </div>
        </section>

        <!-- Contacto -->
        <section id="contacto">
            <h2>Contacto</h2>
            <p>Correo: tienda@ejemplo.com</p>
        </section>

    </main>

    <!-- Pie de página -->
    <footer>
        <p>Mi Tienda Online - 2026</p>
    </footer>

</body>
</html>
